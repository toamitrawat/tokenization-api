apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tokenization-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tokenization-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tokenization-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tokenization-api.selectorLabels" . | nindent 8 }}
      annotations:
        # Force pod restart when ConfigMap or Secret content changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tokenization-api.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: aws-credentials
          secret:
            secretName: {{ .Values.existingSecrets.awsCredentials }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: {{ .Values.javaOpts | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "tokenization-api.fullname" . }}-config
            - secretRef:
                name: {{ .Values.existingSecrets.appSecret }}
          volumeMounts:
            - name: aws-credentials
              mountPath: /root/.aws
              readOnly: true
          startupProbe:
            httpGet:
              path: {{ .Values.management.liveness.path }}
              port: {{ .Values.management.port }}
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.management.liveness.path }}
              port: {{ .Values.management.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.management.readiness.path }}
              port: {{ .Values.management.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
