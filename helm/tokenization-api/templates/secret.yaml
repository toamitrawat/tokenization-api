apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecrets.appSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tokenization-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: {{ required "secrets.dbUsername is required — pass via --set secrets.dbUsername=..." .Values.secrets.dbUsername | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ required "secrets.dbPassword is required — pass via --set secrets.dbPassword=..." .Values.secrets.dbPassword | quote }}
  TOKENIZATION_HMAC_KEY_BASE64: {{ required "secrets.hmacKeyBase64 is required — pass via --set secrets.hmacKeyBase64=..." .Values.secrets.hmacKeyBase64 | quote }}
