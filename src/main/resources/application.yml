spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: ${SPRING_DATASOURCE_USERNAME:amit}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.OracleDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

aws:
  region: ${AWS_REGION:ap-south-1}
  profile: ${AWS_PROFILE:}
  kms:
    key-id: ${AWS_KMS_KEY_ID}
    api-timeout-ms: 5000
    connect-timeout-ms: 2000

server:
  port: 8088

management:
  server:
    port: 8088
  endpoints:
    web:
      exposure:
        include: health          # expose ONLY health — never env, info, metrics
  endpoint:
    health:
      probes:
        enabled: true            # enables /actuator/health/liveness and /readiness
      show-details: never        # no internals leaked via probe responses
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db   # readiness fails if Oracle is unreachable
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

tokenization:
  hmacKeyBase64: ${TOKENIZATION_HMAC_KEY_BASE64}
  max-collision-retries: 10
  kms:
    cache:
      ttl-seconds: 30
      max-size: 100

resilience4j:
  circuitbreaker:
    instances:
      kms:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      kms:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - software.amazon.awssdk.core.exception.SdkServiceException
